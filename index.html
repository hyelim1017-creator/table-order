<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>테이블오더 연습 - 거진어부네 코다리조림</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241f1c;
    --ink-soft:#5b5248;
    --paper:#FBF5EA;
    --panel:#1C1815;
    --panel-soft:#2A2420;
    --red:#C63527;
    --red-dark:#9c2a1f;
    --gold:#B5842A;
    --green:#3E7C59;
    --line:#E4D9C4;
    --white:#FFFFFF;
    --font: 16px;
    --radius: 1.1rem;
  }
  html{ font-size: var(--font); -webkit-text-size-adjust: 100%; }
  html.fs-lg{ --font: 19px; }
  html.fs-xl{ --font: 23px; }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:'Noto Sans KR', sans-serif; background:var(--paper); color:var(--ink);
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  button{ font-family:inherit; cursor:pointer; }
  img,svg{ max-width:100%; }

  /* ---------- App shell ---------- */
  .app{ max-width:56rem; margin:0 auto; min-height:100vh; background:var(--paper); display:flex; flex-direction:column; position:relative; box-shadow:0 0 3rem rgba(0,0,0,.08); overflow:hidden; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:.5rem;
    padding:.7rem .9rem; background:var(--panel); color:var(--white); flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:.5rem; font-weight:900; font-size:1.05rem; letter-spacing:-.02em;}
  .brand .fishmark{ font-size:1.3rem; }
  .practice-pill{
    background:var(--red); color:var(--white); font-weight:700; font-size:.72rem;
    padding:.3rem .6rem; border-radius:2rem; white-space:nowrap;
  }
  .topbar-actions{ display:flex; gap:.4rem; align-items:center; }
  .icon-btn{
    background:var(--panel-soft); color:var(--white); border:1px solid #3a332c; border-radius:.6rem;
    padding:.45rem .6rem; font-size:.85rem; font-weight:700; display:flex; align-items:center; gap:.3rem;
    min-height:2.6rem;
  }
  .icon-btn:focus-visible, button:focus-visible, .card:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
  .fs-group{ display:flex; gap:.25rem; background:var(--panel-soft); border-radius:.6rem; padding:.2rem; }
  .fs-group button{ background:transparent; color:#cfc6ba; border:none; border-radius:.4rem; padding:.4rem .55rem; font-weight:900; min-height:2.4rem;}
  .fs-group button.active{ background:var(--gold); color:var(--panel); }

  /* ---------- Step indicator ---------- */
  .steps{ display:flex; background:var(--white); border-bottom:1px solid var(--line); padding:.6rem .8rem; gap:.4rem; overflow-x:auto; }
  .step{ display:flex; align-items:center; gap:.4rem; padding:.3rem .7rem; border-radius:2rem; font-weight:700; font-size:.8rem; color:var(--ink-soft); background:var(--paper); white-space:nowrap; flex-shrink:0; }
  .step .num{ width:1.35rem; height:1.35rem; border-radius:50%; background:var(--line); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; font-size:.75rem; }
  .step.active{ background:#FCEFE9; color:var(--red-dark); }
  .step.active .num{ background:var(--red); color:var(--white); }
  .step.done .num{ background:var(--green); color:var(--white); }

  .screen{ display:none; flex:1; flex-direction:column; }
  .screen.visible{ display:flex; }

  /* ---------- Start screen ---------- */
  #screen-start{ align-items:center; justify-content:center; text-align:center; padding:2rem 1.2rem; gap:1.2rem; background:
    radial-gradient(circle at 50% 0%, #fff 0%, var(--paper) 60%); }
  .start-mark{ font-size:3.6rem; }
  #screen-start h1{ font-size:1.6rem; margin:.2rem 0 0; line-height:1.35; }
  #screen-start p{ color:var(--ink-soft); font-size:1rem; max-width:26rem; line-height:1.6; margin:0;}
  .cta-btn{
    background:var(--red); color:var(--white); border:none; border-radius:1.4rem; padding:1.1rem 2.2rem;
    font-size:1.25rem; font-weight:900; box-shadow:0 .5rem 1.2rem rgba(198,53,39,.35); min-height:3.4rem;
  }
  .cta-btn:active{ transform:translateY(1px); }
  .qr-box{ margin-top:1rem; background:var(--white); border:1px solid var(--line); border-radius:1rem; padding:1rem; display:flex; flex-direction:column; align-items:center; gap:.5rem;}
  .qr-box img{ width:8rem; height:8rem; border-radius:.5rem; }
  .qr-box span{ font-size:.8rem; color:var(--ink-soft); }

  /* ---------- Menu screen ---------- */
  #screen-menu{ flex-direction:row; align-items:stretch; }
  .sidebar{ width:6.6rem; flex-shrink:0; background:var(--panel); display:flex; flex-direction:column; padding-top:.4rem; }
  .sidebar-call-btn{
    margin-top:auto; margin-bottom:.6rem; background:var(--red); color:var(--white); border:none;
    display:flex; flex-direction:column; align-items:center; gap:.3rem; padding:.75rem .3rem;
    font-weight:800; font-size:.75rem; min-height:4rem; border-radius:0 .8rem .8rem 0;
  }
  .sidebar-call-btn .em{ font-size:1.3rem; }
  .floating-call-btn{
    position:absolute; left:1rem; bottom:6.4rem; z-index:40; background:var(--red); color:var(--white);
    border:none; border-radius:2.4rem; padding:.8rem 1.1rem; font-weight:800; font-size:.85rem;
    display:flex; align-items:center; gap:.4rem; box-shadow:0 .5rem 1.1rem rgba(0,0,0,.28); min-height:3rem;
  }
  .cat-btn{
    background:transparent; border:none; color:#cfc6ba; padding:1rem .4rem; font-weight:800; font-size:1.15rem;
    display:flex; flex-direction:column; align-items:center; gap:.3rem; border-left:.25rem solid transparent; min-height:4.4rem;
  }
  .cat-btn .em{ font-size:1.4rem; }
  .cat-btn.active{ background:var(--paper); color:var(--red-dark); border-left-color:var(--red); border-radius:0 .8rem .8rem 0; }
  .menu-main{ flex:1; padding:1rem; overflow-y:auto; }
  .menu-heading{ font-size:1.05rem; font-weight:900; margin:0 0 .8rem; color:var(--ink); display:flex; align-items:center; gap:.4rem;}
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(9.5rem,1fr)); gap:.9rem; }
  .card{
    background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:.8rem; text-align:left;
    display:flex; flex-direction:column; gap:.5rem; min-height:9.5rem; position:relative;
  }
  .card .thumb{ width:100%; aspect-ratio:1/1; border-radius:.8rem; display:flex; align-items:center; justify-content:center; font-size:2.5rem; overflow:hidden; }
  .thumb img, .sheet-thumb img, .cart-line .thumb img{ width:100%; height:100%; object-fit:cover; border-radius:inherit; }
  .card .name{ font-weight:700; font-size:.95rem; line-height:1.3; }
  .card .price{ font-weight:900; color:var(--red-dark); font-size:1rem; }
  .card .tag{ position:absolute; top:.5rem; left:.5rem; background:var(--gold); color:#fff; font-size:.68rem; font-weight:800; padding:.15rem .45rem; border-radius:.4rem; }

  /* ---------- Bottom bar ---------- */
  .bottombar{
    display:flex; align-items:center; justify-content:space-between; gap:.8rem; padding:.8rem 1rem;
    background:var(--white); border-top:1px solid var(--line); position:sticky; bottom:0;
  }
  .cart-summary{ display:flex; flex-direction:column; }
  .cart-summary .lbl{ font-size:.78rem; color:var(--ink-soft); font-weight:700; }
  .cart-summary .amt{ font-size:1.25rem; font-weight:900; color:var(--ink); }
  .primary-btn{
    background:var(--red); color:var(--white); border:none; border-radius:.9rem; padding:.95rem 1.6rem;
    font-size:1.05rem; font-weight:900; min-height:3.2rem; flex-shrink:0;
  }
  .primary-btn[disabled]{ background:#d8cfc3; color:#9a9184; }
  .ghost-btn{
    background:var(--white); color:var(--ink); border:1.5px solid var(--line); border-radius:.9rem; padding:.85rem 1.2rem;
    font-weight:800; min-height:3.2rem;
  }

  /* ---------- Modal ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(20,16,12,.5); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  .overlay.visible{ display:flex; }
  .sheet{ background:var(--paper); width:100%; max-width:36rem; border-radius:1.4rem 1.4rem 0 0; padding:1.2rem 1.2rem 1.4rem; max-height:88vh; overflow-y:auto; }
  .sheet-drag{ width:2.6rem; height:.3rem; background:var(--line); border-radius:1rem; margin:0 auto .8rem; }
  .sheet-head{ display:flex; align-items:center; gap:.9rem; margin-bottom:.8rem; }
  .sheet-thumb{ width:4.6rem; height:4.6rem; border-radius:.9rem; display:flex; align-items:center; justify-content:center; font-size:2.2rem; flex-shrink:0; overflow:hidden; }
  .sheet-title{ font-size:1.2rem; font-weight:900; }
  .sheet-price{ color:var(--red-dark); font-weight:800; font-size:1.05rem; }
  .sheet-desc{ color:var(--ink-soft); font-size:.9rem; line-height:1.55; margin:.4rem 0 1rem; }
  .opt-group-title{ font-weight:800; font-size:.95rem; margin:.9rem 0 .5rem; display:flex; justify-content:space-between; }
  .opt-group-title .hint{ font-weight:600; font-size:.75rem; color:var(--ink-soft); }
  .opt-row{ display:flex; align-items:center; justify-content:space-between; padding:.75rem .2rem; border-bottom:1px solid var(--line); gap:.6rem; }
  .opt-row .opt-label{ display:flex; align-items:center; gap:.6rem; font-weight:600; font-size:.95rem; }
  .opt-row .opt-price{ font-weight:700; color:var(--ink-soft); font-size:.85rem; white-space:nowrap; }
  .check-box, .radio-box{
    width:1.5rem; height:1.5rem; border-radius:.4rem; border:2px solid var(--line); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; background:#fff;
  }
  .radio-box{ border-radius:50%; }
  .opt-row.selected .check-box, .opt-row.selected .radio-box{ background:var(--red); border-color:var(--red); color:#fff; font-weight:900; }
  .stepper{ display:flex; align-items:center; gap:0; border:1.5px solid var(--line); border-radius:.8rem; overflow:hidden; background:#fff; }
  .stepper button{ background:var(--paper); border:none; width:2.6rem; height:2.6rem; font-size:1.2rem; font-weight:900; color:var(--ink); }
  .stepper .qty{ width:2.6rem; text-align:center; font-weight:900; font-size:1.05rem; }
  .qty-row{ display:flex; align-items:center; justify-content:space-between; margin-top:1rem; }
  .qty-row .lbl{ font-weight:800; }
  .sheet-footer{ display:flex; align-items:center; gap:.7rem; margin-top:1.1rem; }
  .sheet-total{ flex:1; font-size:1.15rem; font-weight:900; }
  .close-x{ background:transparent; border:none; font-size:1.4rem; color:var(--ink-soft); margin-left:auto; min-width:2.4rem; min-height:2.4rem; }

  /* ---------- Cart / payment / complete screens ---------- */
  .panel-scroll{ flex:1; overflow-y:auto; padding:1rem; }
  .empty-state{ text-align:center; color:var(--ink-soft); padding:3rem 1rem; display:flex; flex-direction:column; gap:.6rem; align-items:center; }
  .empty-state .em{ font-size:2.6rem; }
  .cart-line{ background:var(--white); border:1px solid var(--line); border-radius:1rem; padding:.9rem; display:flex; gap:.8rem; margin-bottom:.8rem; align-items:center; }
  .cart-line .thumb{ width:3.6rem; height:3.6rem; border-radius:.7rem; display:flex; align-items:center; justify-content:center; font-size:1.7rem; flex-shrink:0; overflow:hidden; }
  .cart-line .info{ flex:1; min-width:0; }
  .cart-line .info .n{ font-weight:800; font-size:.98rem; }
  .cart-line .info .o{ font-size:.78rem; color:var(--ink-soft); margin-top:.15rem; }
  .cart-line .info .p{ font-weight:900; color:var(--red-dark); margin-top:.3rem; }
  .cart-line .stepper button{ width:2.2rem; height:2.2rem; font-size:1rem; }
  .cart-line .stepper .qty{ width:2.2rem; }
  .remove-btn{ background:none; border:none; color:#a89f92; font-size:1.3rem; padding:.3rem; min-width:2.2rem; min-height:2.2rem; }

  .total-box{ background:var(--white); border:1px solid var(--line); border-radius:1rem; padding:1rem; margin-top:.4rem; }
  .total-row{ display:flex; justify-content:space-between; padding:.3rem 0; font-size:.95rem; color:var(--ink-soft); }
  .total-row.grand{ font-size:1.25rem; font-weight:900; color:var(--ink); border-top:1px dashed var(--line); margin-top:.4rem; padding-top:.7rem; }

  .pay-options{ display:flex; flex-direction:column; gap:.8rem; }
  .pay-card{ background:var(--white); border:2px solid var(--line); border-radius:1.1rem; padding:1.1rem; display:flex; align-items:center; gap:1rem; text-align:left; }
  .pay-card .em{ font-size:1.8rem; }
  .pay-card .t{ font-weight:900; font-size:1.05rem; }
  .pay-card .d{ font-size:.82rem; color:var(--ink-soft); margin-top:.2rem; }
  .pay-card.selected{ border-color:var(--red); background:#FCEFE9; }

  #screen-processing{ align-items:center; justify-content:center; gap:1.2rem; text-align:center; padding:2rem; }
  .spinner{ width:4rem; height:4rem; border-radius:50%; border:.5rem solid var(--line); border-top-color:var(--red); animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  #screen-complete{ align-items:center; justify-content:center; text-align:center; padding:2rem 1.2rem; gap:1rem; }
  .pot{ position:relative; width:7rem; height:7rem; }
  .pot svg{ width:100%; height:100%; }
  .steam{ position:absolute; top:-1.1rem; left:50%; transform:translateX(-50%); font-size:1.6rem; opacity:.85; animation:rise 2.4s ease-in-out infinite; }
  @keyframes rise{ 0%{ transform:translate(-50%,0); opacity:.2;} 50%{ opacity:.9; } 100%{ transform:translate(-50%,-1.4rem); opacity:0;} }
  .order-num{ background:var(--panel); color:var(--white); font-weight:900; font-size:1.7rem; padding:.8rem 1.6rem; border-radius:1rem; letter-spacing:.05em; }

  .toast{ position:fixed; left:50%; bottom:6.5rem; transform:translateX(-50%); background:var(--panel); color:#fff; padding:.8rem 1.2rem; border-radius:1rem; font-weight:700; font-size:.9rem; z-index:80; box-shadow:0 .5rem 1.2rem rgba(0,0,0,.3); max-width:88%; text-align:center; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .toast.show{ opacity:1; }

  .call-fab{ position:sticky; bottom:5.4rem; align-self:flex-end; margin:0 1rem; background:var(--panel); color:#fff; border:none; border-radius:2rem; padding:.7rem 1rem; font-weight:800; font-size:.85rem; display:flex; align-items:center; gap:.4rem; box-shadow:0 .4rem 1rem rgba(0,0,0,.25); }

  @media (max-width:420px){
    .sidebar{ width:5.2rem; }
    .cat-btn{ font-size:.95rem; padding:.8rem .2rem; }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="topbar">
    <div class="brand"><span class="fishmark">🐟</span> 거진어부네 코다리조림 <span class="practice-pill">연습모드</span></div>
    <div class="topbar-actions">
      <div class="fs-group" role="group" aria-label="글자 크기 선택">
        <button data-fs="normal" class="active" aria-label="글자 크기 보통">가</button>
        <button data-fs="lg" aria-label="글자 크기 크게" style="font-size:1.1em;">가</button>
        <button data-fs="xl" aria-label="글자 크기 아주 크게" style="font-size:1.25em;">가</button>
      </div>
      <button class="icon-btn" id="btnHelp" aria-label="도움말">❓ 도움말</button>
    </div>
  </div>

  <div class="steps" id="steps" aria-hidden="true">
    <div class="step" data-step="menu"><span class="num">1</span> 메뉴선택</div>
    <div class="step" data-step="cart"><span class="num">2</span> 장바구니</div>
    <div class="step" data-step="payment"><span class="num">3</span> 결제</div>
    <div class="step" data-step="complete"><span class="num">4</span> 완료</div>
  </div>

  <!-- START -->
  <section class="screen visible" id="screen-start">
    <div class="start-mark">🍲🐟</div>
    <h1>테이블오더 연습을 시작해볼까요?</h1>
    <p>실제 식당 태블릿 주문기와 똑같이 만들었어요. 천천히, 여러 번 눌러봐도 괜찮아요.<br>실제로 결제되지 않으니 마음 편히 연습하세요.</p>
    <button class="cta-btn" id="btnStart">화면을 눌러 시작하기</button>
    <div class="qr-box">
      <img id="qrImg" alt="이 연습 사이트 접속용 QR코드" src="">
      <span>휴대폰 카메라로 QR을 찍으면 이 화면으로 바로 올 수 있어요</span>
    </div>
  </section>

  <!-- MENU -->
  <section class="screen" id="screen-menu">
    <nav class="sidebar" id="sidebar" aria-label="메뉴 카테고리"></nav>
    <div class="menu-main">
      <h2 class="menu-heading" id="menuHeading"></h2>
      <div class="grid" id="menuGrid"></div>
    </div>
  </section>

  <!-- CART -->
  <section class="screen" id="screen-cart">
    <div class="panel-scroll" id="cartList"></div>
  </section>

  <!-- PAYMENT -->
  <section class="screen" id="screen-payment">
    <div class="panel-scroll">
      <h2 class="menu-heading">결제 수단을 선택해 주세요</h2>
      <div class="pay-options" id="payOptions">
        <button class="pay-card" data-pay="card"><span class="em">💳</span><span><span class="t">카드 결제</span><span class="d">신용/체크카드를 투입구에 넣어주세요 (연습)</span></span></button>
        <button class="pay-card" data-pay="cash"><span class="em">💵</span><span><span class="t">현금 결제</span><span class="d">직원이 도와드립니다 (연습)</span></span></button>
        <button class="pay-card" data-pay="app"><span class="em">📱</span><span><span class="t">간편결제(QR)</span><span class="d">화면의 QR을 스캔해 주세요 (연습)</span></span></button>
      </div>
      <div class="total-box" id="paySummary" style="margin-top:1.2rem;"></div>
    </div>
  </section>

  <!-- PROCESSING -->
  <section class="screen" id="screen-processing">
    <div class="spinner" role="status" aria-label="결제 처리 중"></div>
    <h2 style="margin:0;">결제를 진행하고 있어요…</h2>
    <p style="color:var(--ink-soft); margin:0;">화면을 만지지 말고 잠시만 기다려 주세요</p>
  </section>

  <!-- COMPLETE -->
  <section class="screen" id="screen-complete">
    <div class="pot">
      <span class="steam">💨</span>
      <svg viewBox="0 0 100 100"><circle cx="50" cy="55" r="38" fill="#C63527"/><ellipse cx="50" cy="30" rx="38" ry="9" fill="#9c2a1f"/></svg>
    </div>
    <h1 style="margin:.2rem 0;">주문이 완료됐어요!</h1>
    <p style="color:var(--ink-soft); margin:0;">잠시 후 맛있는 코다리조림이 준비됩니다</p>
    <div class="order-num" id="orderNum">대기번호 12</div>
    <button class="cta-btn" id="btnRestart" style="margin-top:1rem;">처음 화면으로 (다시 연습하기)</button>
  </section>

  <!-- Bottom bar (menu/cart/payment) -->
  <div class="bottombar" id="bottombar" style="display:none;">
    <div class="cart-summary">
      <span class="lbl" id="bbLabel">담은 메뉴</span>
      <span class="amt" id="bbAmount">0원</span>
    </div>
    <div style="display:flex; gap:.5rem;">
      <button class="ghost-btn" id="btnBack" style="display:none;">이전</button>
      <button class="primary-btn" id="btnNext" disabled>장바구니 보기</button>
    </div>
  </div>

  <!-- Modal sheet for item options -->
  <div class="overlay" id="overlay">
    <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
  </div>

  <button class="floating-call-btn" id="floatingCallBtn" style="display:none;" aria-label="직원 호출하기">🔔 직원 호출</button>

  <div class="toast" id="toast"></div>
</div>

<script>

/* ---------------- Helpers ---------------- */
const won = n => n.toLocaleString('ko-KR') + '원';
function findItem(id){
  for(const c of CAT_ORDER){ const f = MENU[c].items.find(i=>i.id===id); if(f) return f; }
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 2200);
}
function goto(screenId){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('visible'));
  document.getElementById('screen-'+screenId).classList.add('visible');
  const bb = document.getElementById('bottombar');
  bb.style.display = (screenId==='menu'||screenId==='cart'||screenId==='payment') ? 'flex' : 'none';
  document.getElementById('steps').style.visibility = (screenId==='start'||screenId==='processing'||screenId==='complete') ? 'hidden' : 'visible';
  document.getElementById('floatingCallBtn').style.display = (screenId==='cart'||screenId==='payment'||screenId==='complete') ? 'flex' : 'none';
  updateSteps(screenId);
  updateBottombar(screenId);
  window.scrollTo(0,0);
}
document.getElementById('floatingCallBtn').onclick = ()=>callStaff();
function updateSteps(screenId){
  const map = {menu:'menu', cart:'cart', payment:'payment', complete:'complete'};
  const activeKey = map[screenId];
  const order = ['menu','cart','payment','complete'];
  document.querySelectorAll('.step').forEach(el=>{
    const k = el.dataset.step;
    el.classList.remove('active','done');
    if(!activeKey) return;
    const ai = order.indexOf(activeKey), ei = order.indexOf(k);
    if(ei < ai) el.classList.add('done');
    else if(ei === ai) el.classList.add('active');
  });
}
function cartCount(){ return cart.reduce((s,l)=>s+l.qty,0); }
function lineTotal(l){ return l.basePrice*l.qty + (l.addonSum||0); }
function cartTotal(){ return cart.reduce((s,l)=>s+lineTotal(l),0); }

function updateBottombar(screenId){
  const bbLabel = document.getElementById('bbLabel');
  const bbAmount = document.getElementById('bbAmount');
  const btnNext = document.getElementById('btnNext');
  const btnBack = document.getElementById('btnBack');
  bbAmount.textContent = won(cartTotal());
  if(screenId==='menu'){
    bbLabel.textContent = `담은 메뉴 ${cartCount()}개`;
    btnNext.textContent = '장바구니 보기';
    btnNext.disabled = cartCount()===0;
    btnNext.onclick = ()=>{ renderCart(); goto('cart'); };
    btnBack.style.display='none';
  } else if(screenId==='cart'){
    bbLabel.textContent = '결제 예정 금액';
    btnNext.textContent = '주문하기';
    btnNext.disabled = cartCount()===0;
    btnNext.onclick = ()=>{ renderPayment(); goto('payment'); };
    btnBack.style.display='inline-block';
    btnBack.onclick = ()=>goto('menu');
  } else if(screenId==='payment'){
    bbLabel.textContent = '결제 예정 금액';
    btnNext.textContent = '결제하기';
    btnNext.disabled = !selectedPay;
    btnNext.onclick = doPay;
    btnBack.style.display='inline-block';
    btnBack.onclick = ()=>goto('cart');
  }
}

/* ---------------- Menu rendering ---------------- */
function renderSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  CAT_ORDER.forEach(key=>{
    const cat = MENU[key];
    const b = document.createElement('button');
    b.className = 'cat-btn' + (key===currentCat ? ' active':'');
    b.innerHTML = `<span>${cat.label}</span>`;
    b.setAttribute('aria-pressed', key===currentCat);
    b.onclick = ()=>{ currentCat = key; renderSidebar(); renderGrid(); };
    sb.appendChild(b);
  });
  const callBtn = document.createElement('button');
  callBtn.className = 'sidebar-call-btn';
  callBtn.innerHTML = `<span class="em">🔔</span><span>직원 호출</span>`;
  callBtn.setAttribute('aria-label', '직원 호출하기');
  callBtn.onclick = callStaff;
  sb.appendChild(callBtn);
}
function callStaff(){
  showToast('🔔 직원을 호출했어요 (연습 화면이라 실제로 호출되지 않아요)');
}
function renderGrid(){
  const cat = MENU[currentCat];
  document.getElementById('menuHeading').textContent = `${cat.label} 메뉴`;
  const grid = document.getElementById('menuGrid');
  grid.innerHTML = '';
  cat.items.forEach(item=>{
    const c = document.createElement('button');
    c.className = 'card';
    c.setAttribute('aria-label', `${item.name}, ${won(item.price)}, 눌러서 담기`);
    c.innerHTML = `
      <div class="thumb" style="background:${item.bg}">${item.img ? `<img src="${item.img}" alt="${item.name} 사진">` : item.emoji}</div>
      <div class="name">${item.name}</div>
      <div class="price">${won(item.price)}</div>
    `;
    c.onclick = ()=>openItemSheet(item);
    grid.appendChild(c);
  });
}

/* ---------------- Item sheet (modal) ---------------- */
let sheetState = null;
function openItemSheet(item){
  sheetState = { item, qty:1, addons:new Set(), sizeId: item.sizeOptions ? item.sizeOptions[0].id : null };
  renderSheet();
  document.getElementById('overlay').classList.add('visible');
}
function closeSheet(){ document.getElementById('overlay').classList.remove('visible'); }
function sheetBreakdown(){
  const {item, sizeId, addons, qty} = sheetState;
  let base = item.price;
  if(item.sizeOptions){ base = item.sizeOptions.find(o=>o.id===sizeId).price; }
  let addonSum = 0;
  const addonLines = [];
  if(item.addons){
    addons.forEach(aid=>{
      const a = item.addons.find(a=>a.id===aid);
      addonSum += a.price;
      addonLines.push(a);
    });
  }
  return { base, addonSum, addonLines, qty, total: base*qty + addonSum, unitLabel: item.unitLabel || '개' };
}
function renderSheet(){
  const { item, qty, addons, sizeId } = sheetState;
  const sheet = document.getElementById('sheet');
  let optionsHtml = '';
  if(item.sizeOptions){
    optionsHtml += `<div class="opt-group-title">수량 옵션 <span class="hint">한 가지 선택</span></div>`;
    item.sizeOptions.forEach(o=>{
      const sel = o.id===sizeId;
      optionsHtml += `<button class="opt-row ${sel?'selected':''}" data-size="${o.id}" style="width:100%; background:none; border-radius:.6rem;">
        <span class="opt-label"><span class="radio-box">${sel?'●':''}</span>${o.name}</span>
        <span class="opt-price">${won(o.price)}</span>
      </button>`;
    });
  }
  if(item.addons){
    optionsHtml += `<div class="opt-group-title">추가 옵션 <span class="hint">여러 개 선택 가능 · 인분 수와 상관없이 한 번만 추가돼요</span></div>`;
    item.addons.forEach(a=>{
      const sel = addons.has(a.id);
      optionsHtml += `<button class="opt-row ${sel?'selected':''}" data-addon="${a.id}" style="width:100%; background:none; border-radius:.6rem;">
        <span class="opt-label"><span class="check-box">${sel?'✓':''}</span>${a.name}</span>
        <span class="opt-price">+${won(a.price)}</span>
      </button>`;
    });
  }
  const bd = sheetBreakdown();
  const unitLabelText = item.unitLabel || '개';
  let breakdownHtml = `<div class="total-row"><span>${won(bd.base)} × ${bd.qty}${unitLabelText}</span><span>${won(bd.base*bd.qty)}</span></div>`;
  bd.addonLines.forEach(a=>{
    breakdownHtml += `<div class="total-row"><span>+ ${a.name}</span><span>${won(a.price)}</span></div>`;
  });
  sheet.innerHTML = `
    <div class="sheet-drag"></div>
    <div class="sheet-head">
      <div class="sheet-thumb" style="background:${item.bg}">${item.img ? `<img src="${item.img}" alt="${item.name} 사진">` : item.emoji}</div>
      <div>
        <div class="sheet-title">${item.name}</div>
        <div class="sheet-price">${won(bd.base)} <span style="font-weight:600; color:var(--ink-soft); font-size:.85rem;">/ 1${unitLabelText}</span></div>
      </div>
      <button class="close-x" id="sheetClose" aria-label="닫기">✕</button>
    </div>
    ${item.desc ? `<div class="sheet-desc">${item.desc}</div>` : ''}
    ${optionsHtml}
    <div class="qty-row">
      <span class="lbl">${unitLabelText} 수</span>
      <div class="stepper">
        <button id="qtyMinus" aria-label="${unitLabelText} 줄이기">−</button>
        <span class="qty" id="qtyVal">${qty}</span>
        <button id="qtyPlus" aria-label="${unitLabelText} 늘리기">+</button>
      </div>
    </div>
    <div class="total-box" style="margin-top:1rem;">
      ${breakdownHtml}
      <div class="total-row grand"><span>총 금액</span><span>${won(bd.total)}</span></div>
    </div>
    <div class="sheet-footer">
      <button class="primary-btn" id="addToCartBtn" style="width:100%;">장바구니 담기</button>
    </div>
  `;
  document.getElementById('sheetClose').onclick = closeSheet;
  document.getElementById('qtyMinus').onclick = ()=>{ sheetState.qty = Math.max(1, sheetState.qty-1); renderSheet(); };
  document.getElementById('qtyPlus').onclick = ()=>{ sheetState.qty = Math.min(20, sheetState.qty+1); renderSheet(); };
  sheet.querySelectorAll('[data-size]').forEach(b=>{
    b.onclick = ()=>{ sheetState.sizeId = b.dataset.size; renderSheet(); };
  });
  sheet.querySelectorAll('[data-addon]').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.addon;
      if(sheetState.addons.has(id)) sheetState.addons.delete(id); else sheetState.addons.add(id);
      renderSheet();
    };
  });
  document.getElementById('addToCartBtn').onclick = confirmAddToCart;
}
function confirmAddToCart(){
  const { item, qty, addons, sizeId } = sheetState;
  const bd = sheetBreakdown();
  let optionLabel = '';
  if(item.sizeOptions){ optionLabel = item.sizeOptions.find(o=>o.id===sizeId).name; }
  if(item.addons && addons.size){
    const names = [...addons].map(id=>item.addons.find(a=>a.id===id).name);
    optionLabel = optionLabel ? optionLabel + ', ' + names.join(', ') : names.join(', ');
  }
  const key = item.id + '|' + optionLabel;
  const existing = cart.find(l=>l.key===key);
  if(existing){ existing.qty += qty; }
  else{
    cart.push({ key, id:item.id, name:item.name, basePrice:bd.base, addonSum:bd.addonSum, unitLabel:bd.unitLabel, qty, optionLabel, emoji:item.emoji, bg:item.bg, img:item.img });
  }
  closeSheet();
  updateBottombar('menu');
  showToast(`${item.name} ${qty}${bd.unitLabel}를 장바구니에 담았어요`);
}

/* ---------------- Cart screen ---------------- */
function renderCart(){
  const list = document.getElementById('cartList');
  if(cart.length===0){
    list.innerHTML = `<div class="empty-state"><span class="em">🛒</span><div>아직 담은 메뉴가 없어요</div><button class="ghost-btn" onclick="goto('menu')">메뉴 보러가기</button></div>`;
    return;
  }
  let html = `<h2 class="menu-heading">장바구니 (${cartCount()}개)</h2>`;
  cart.forEach((l,idx)=>{
    html += `
    <div class="cart-line">
      <div class="thumb" style="background:${l.bg}">${l.img ? `<img src="${l.img}" alt="${l.name} 사진">` : l.emoji}</div>
      <div class="info">
        <div class="n">${l.name}</div>
        ${l.optionLabel ? `<div class="o">${l.optionLabel}</div>` : ''}
        <div class="o">${won(l.basePrice)} × ${l.qty}${l.unitLabel||'개'}${l.addonSum ? ` + 옵션 ${won(l.addonSum)}` : ''}</div>
        <div class="p">${won(lineTotal(l))}</div>
      </div>
      <div class="stepper">
        <button data-act="minus" data-idx="${idx}" aria-label="수량 줄이기">−</button>
        <span class="qty">${l.qty}</span>
        <button data-act="plus" data-idx="${idx}" aria-label="수량 늘리기">+</button>
      </div>
      <button class="remove-btn" data-act="remove" data-idx="${idx}" aria-label="삭제">🗑</button>
    </div>`;
  });
  const total = cartTotal();
  html += `
  <div class="total-box">
    <div class="total-row"><span>메뉴 금액</span><span>${won(total)}</span></div>
    <div class="total-row grand"><span>총 결제금액</span><span>${won(total)}</span></div>
  </div>`;
  list.innerHTML = html;
  list.querySelectorAll('[data-act]').forEach(b=>{
    b.onclick = ()=>{
      const idx = +b.dataset.idx, act = b.dataset.act;
      if(act==='plus') cart[idx].qty = Math.min(20, cart[idx].qty+1);
      if(act==='minus') cart[idx].qty = Math.max(1, cart[idx].qty-1);
      if(act==='remove') cart.splice(idx,1);
      renderCart(); updateBottombar('cart');
    };
  });
}

/* ---------------- Payment screen ---------------- */
let selectedPay = null;
function renderPayment(){
  selectedPay = null;
  document.querySelectorAll('.pay-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('paySummary').innerHTML = `
    <div class="total-row"><span>담은 메뉴</span><span>${cartCount()}개</span></div>
    <div class="total-row grand"><span>결제 금액</span><span>${cartTotal().toLocaleString('ko-KR')}원</span></div>
  `;
  updateBottombar('payment');
}
document.getElementById('payOptions').addEventListener('click', (e)=>{
  const card = e.target.closest('.pay-card');
  if(!card) return;
  document.querySelectorAll('.pay-card').forEach(c=>c.classList.remove('selected'));
  card.classList.add('selected');
  selectedPay = card.dataset.pay;
  updateBottombar('payment');
});
function doPay(){
  if(!selectedPay) return;
  goto('processing');
  setTimeout(()=>{
    const num = Math.floor(Math.random()*80)+10;
    document.getElementById('orderNum').textContent = `대기번호 ${num}`;
    goto('complete');
  }, 1800);
}

/* ---------------- Start / restart / help ---------------- */
document.getElementById('btnStart').onclick = ()=>{
  currentCat='meal'; renderSidebar(); renderGrid(); goto('menu'); updateBottombar('menu');
};
document.getElementById('btnRestart').onclick = ()=>{
  cart = []; goto('start');
};
document.getElementById('btnHelp').onclick = ()=>{
  showToast('메뉴를 눌러 담고, 아래 버튼으로 장바구니→결제까지 순서대로 진행하면 돼요.');
};

/* ---------------- Font size control ---------------- */
document.querySelectorAll('.fs-group button').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.fs-group button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.documentElement.classList.remove('fs-lg','fs-xl');
    if(btn.dataset.fs==='lg') document.documentElement.classList.add('fs-lg');
    if(btn.dataset.fs==='xl') document.documentElement.classList.add('fs-xl');
  };
});

/* ---------------- QR code (points to this page) ---------------- */
(function(){
  const url = window.location.href;
  const qr = document.getElementById('qrImg');
  qr.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(url);
  qr.onerror = ()=>{ qr.closest('.qr-box').style.display='none'; };
})();

/* ---------------- init ---------------- */
renderSidebar();
renderGrid();
goto('start');
</script>
</body>
</html>
